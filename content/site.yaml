intro: >-
  Daphne Merel is a mixed media artist. She builds thick, textured surfaces in paint —
  sweeping turquoise seas, layered grounds of rose and green — and gives them tiny inhabitants:
  surfers, a swan, two parrots in flight. Next to her paintings she draws in ink, pencil and
  watercolour. Commissions are welcome.
