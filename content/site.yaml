bio:
  nl: |-
    Ik ben Daphne Merel, een mixed media kunstenaar met een voorliefde voor textuur, contrast en kleine momenten van aandacht. In mijn werk combineer ik gelaagde verf, tastbare oppervlakken en fijne figuratieve details tot stille verhalen in uitgesproken, materiële werelden.

    Natuur, het dagelijks leven en vluchtige emoties vinden vaak hun weg in mijn werk — een vogel, een bloem, een glimp van een plek. Ik werk graag met rijke texturen en lagen, waarin kleur, vorm en kleine onderwerpen samenkomen en zorgen voor sfeer, diepte en nieuwsgierigheid.

    Opdrachten zijn van harte welkom. Ik maak graag samen met jou een uniek werk dat jouw verhaal vertelt.
  en: |-
    I'm Daphne Merel, a mixed media artist drawn to texture, contrast and small moments of focus. My work combines layered paint, tactile surfaces and delicate figurative details, creating quiet stories within bold material worlds.

    Nature, everyday life and fleeting emotions often find their way into my work — a bird, a bloom, a glimpse of a place. I love working with rich textures and layers, letting colors, forms and small subjects come together to create atmosphere, depth and a sense of curiosity.

    Commissions are very welcome. I'd love to create a unique piece together that tells your story.
