# Experiments shown under /experimental, in this order (numbered automatically: 01, 02, …).
# Add a new one by adding an entry. `href` is the page of the experiment (without language).
# title / summary may be one text, or { nl: …, en: … }.
# Only list experiments made with Daphne Merel's own work.
- title: "Catching Waves — Beyond the Canvas"
  href: /catching-waves-preview
  date: 2026-10-09
  summary:
    nl: >-
      Een camera die meebeweegt met het scrollen: van het atelier de verf in, met een van de eigen
      miniatuursurfers van het werk langs zijn streek, en terug naar het hele werk.
    en: >-
      A scroll-driven camera that moves from the studio into the paint, follows one of the work's
      own miniature surfers along his stroke, and returns to the whole work.

- title:
    nl: "Catching Waves — Levend kunstwerk"
    en: "Catching Waves — Living artwork"
  href: /catching-waves-living
  date: 2026-10-11
  summary:
    nl: >-
      Het schilderij blijft zoals het is; alleen een van zijn eigen surfers komt tot leven en glijdt
      een stukje langs zijn streek, waarna het onaangeroerde schilderij terugkeert.
    en: >-
      The painting stays as it is; only one of its own surfers comes alive and rides a short way
      down his stroke, before the untouched painting returns.

