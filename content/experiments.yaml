# Experiments shown under /experimental, in this order (numbered automatically: 01, 02, …).
# Add a new one by adding an entry. `href` is the page of the experiment.
# Only list experiments made with Daphne Merel's own work.
- title: "Catching Waves — Beyond the Canvas"
  href: /catching-waves-preview
  date: 2026-10-09
  summary: >-
    A scroll-driven camera that moves from the studio into the paint, follows one of the work's
    own miniature surfers along his stroke, and returns to the whole work.

- title: "Catching Waves — Living artwork"
  href: /catching-waves-living
  date: 2026-10-11
  summary: >-
    The painting stays as it is; only one of its own surfers comes alive and rides a short way
    down his stroke, before the untouched painting returns.
